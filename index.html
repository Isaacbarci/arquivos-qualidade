<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b4fa3" />
  <title>Central de Arquivos | Palmont</title>
  <style>
    :root {
      --azul: #0b4fa3;
      --azul-2: #0d67c8;
      --azul-claro: #eaf3ff;
      --fundo: #f4f7fb;
      --texto: #1d2a3a;
      --muted: #6a7787;
      --borda: #dce5ef;
      --branco: #ffffff;
      --verde: #178a52;
      --sombra: 0 10px 28px rgba(22, 52, 87, .10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      color: var(--texto);
      background: var(--fundo);
    }

    header {
      background: linear-gradient(135deg, var(--azul), var(--azul-2));
      color: #fff;
      padding: 26px 18px 54px;
      box-shadow: 0 4px 18px rgba(0,0,0,.15);
    }

    .header-inner,
    main {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-img {
      width: min(330px, 58vw);
      height: auto;
      display: block;
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      box-shadow: 0 5px 16px rgba(0,0,0,.14);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.1;
    }

    .subtitle {
      margin: 6px 0 0;
      color: rgba(255,255,255,.85);
      font-size: 14px;
    }

    main {
      margin-top: -30px;
      padding-bottom: 46px;
    }

    .toolbar {
      background: var(--branco);
      border: 1px solid var(--borda);
      box-shadow: var(--sombra);
      border-radius: 18px;
      padding: 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .search-wrap {
      position: relative;
    }

    .search-wrap span {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      opacity: .6;
    }

    input[type="search"] {
      width: 100%;
      height: 48px;
      border: 1px solid var(--borda);
      border-radius: 12px;
      padding: 0 16px 0 44px;
      font-size: 15px;
      outline: none;
      background: #fbfdff;
    }

    input[type="search"]:focus {
      border-color: #7fb2eb;
      box-shadow: 0 0 0 3px rgba(13,103,200,.10);
    }

    select {
      height: 48px;
      min-width: 180px;
      padding: 0 12px;
      border: 1px solid var(--borda);
      border-radius: 12px;
      background: #fff;
      color: var(--texto);
      font-size: 14px;
      outline: none;
    }

    .info-row {
      margin: 18px 2px 10px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--borda);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 6px 16px rgba(24,54,87,.06);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 190px;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(24,54,87,.11);
    }

    .file-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .file-icon {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--azul-claro);
      color: var(--azul);
      display: grid;
      place-items: center;
      font-weight: 800;
      flex: 0 0 auto;
    }

    .file-title {
      margin: 1px 0 4px;
      font-size: 16px;
      line-height: 1.25;
      word-break: break-word;
    }

    .file-meta {
      margin: 0;
      font-size: 12px;
      color: var(--muted);
    }

    .description {
      color: #526071;
      font-size: 13px;
      line-height: 1.4;
      flex: 1;
    }

    .tag {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      background: #eef4fb;
      color: #3d5873;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: auto;
    }

    .btn {
      text-decoration: none;
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      border: 1px solid var(--borda);
      color: var(--azul);
      background: #fff;
    }

    .btn-primary {
      color: #fff;
      background: var(--azul);
      border-color: var(--azul);
    }

    .btn:hover { filter: brightness(.98); }

    .empty {
      grid-column: 1 / -1;
      background: #fff;
      border: 1px dashed #b7c6d7;
      border-radius: 16px;
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
    }

    footer {
      text-align: center;
      color: #7a8795;
      font-size: 12px;
      padding: 18px;
    }

    @media (max-width: 850px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      header { padding-top: 20px; }
      .toolbar { grid-template-columns: 1fr; }
      select { width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .info-row { align-items: flex-start; flex-direction: column; }
      .actions { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand">
        <img class="logo-img" src="logo-palmont.png" alt="Palmont Montagem Industrial">
        <div>
          <h1>Central de Arquivos Palmont</h1>
          <p class="subtitle">Documentos, planilhas, manuais e arquivos de uso interno.</p>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <div class="search-wrap">
        <span>🔎</span>
        <input id="search" type="search" placeholder="Buscar por nome, descrição ou categoria..." autocomplete="off" />
      </div>
      <select id="category">
        <option value="">Todas as categorias</option>
      </select>
    </section>

    <div class="info-row">
      <span id="count">0 arquivos</span>
      <span>Atualizado automaticamente conforme a lista cadastrada.</span>
    </div>

    <section id="fileGrid" class="grid"></section>
  </main>

  <footer>
    Palmont Construção e Montagem Industrial • Central de Arquivos
  </footer>

  <script>
    const clientes = [
      {
            "nome": "Documentos da Qualidade - Shalom",
            "categoria": "Shalom",
            "descricao": "Documentos da Qualidade referentes ao cliente Shalom.",
            "tipo": "PASTA",
            "zip": "arquivos/Shalom.zip"
      },
      {
            "nome": "Documentos da Qualidade - PALMONT",
            "categoria": "PALMONT",
            "descricao": "Documentos da Qualidade referentes ao cliente PALMONT.",
            "tipo": "PASTA",
            "zip": ""
      },
      {
            "nome": "Documentos da Qualidade - HCI",
            "categoria": "HCI",
            "descricao": "Documentos da Qualidade referentes ao cliente HCI.",
            "tipo": "PASTA",
            "zip": ""
      },
      {
            "nome": "Documentos da Qualidade - CISENG",
            "categoria": "CISENG",
            "descricao": "Documentos da Qualidade referentes ao cliente CISENG.",
            "tipo": "PASTA",
            "zip": "arquivos/CISENG.zip"
      }
];
    const documentos = {
      "Shalom": [
            {
                  "nome": "N-PAL-SH-001-26 ...pdf",
                  "arquivo": "arquivos/CRND-001-SH/N-PAL-SH-001-26 ...pdf",
                  "categoria": "Shalom",
                  "descricao": "Documento da Qualidade - Shalom.",
                  "tipo": "PDF"
            },
            {
                  "nome": "N-PAL-SH-002-26.pdf",
                  "arquivo": "arquivos/CRND-001-SH/N-PAL-SH-002-26.pdf",
                  "categoria": "Shalom",
                  "descricao": "Documento da Qualidade - Shalom.",
                  "tipo": "PDF"
            }
      ],
      "CISENG": [
            {
                  "nome": "N-PAL-CS-PALM-003-26.pdf",
                  "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-003-26.pdf",
                  "categoria": "CISENG",
                  "descricao": "Documento da Qualidade - CISENG.",
                  "tipo": "PDF"
            },
            {
                  "nome": "N-PAL-CS-PALM-004-26.pdf",
                  "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-004-26.pdf",
                  "categoria": "CISENG",
                  "descricao": "Documento da Qualidade - CISENG.",
                  "tipo": "PDF"
            },
            {
                  "nome": "N-PAL-CS-PALM-005-26.pdf",
                  "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-005-26.pdf",
                  "categoria": "CISENG",
                  "descricao": "Documento da Qualidade - CISENG.",
                  "tipo": "PDF"
            },
            {
                  "nome": "N-PAL-CS-PALM-006-26.pdf",
                  "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-006-26.pdf",
                  "categoria": "CISENG",
                  "descricao": "Documento da Qualidade - CISENG.",
                  "tipo": "PDF"
            },
            {
                  "nome": "N-PAL-CS-PALM-007-26.pdf",
                  "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-007-26.pdf",
                  "categoria": "CISENG",
                  "descricao": "Documento da Qualidade - CISENG.",
                  "tipo": "PDF"
            },
            {
                  "nome": "N-PAL-CS-PALM-008-26.pdf",
                  "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-008-26.pdf",
                  "categoria": "CISENG",
                  "descricao": "Documento da Qualidade - CISENG.",
                  "tipo": "PDF"
            },
            {
                  "nome": "RE-PA-CS-PALM-002-26.pdf",
                  "arquivo": "arquivos/CRND-001-CIS/RE-PA-CS-PALM-002-26.pdf",
                  "categoria": "CISENG",
                  "descricao": "Documento da Qualidade - CISENG.",
                  "tipo": "PDF"
            },
            {
                  "nome": "RE-PAL-CS-PALM-001-26-2.pdf",
                  "arquivo": "arquivos/CRND-001-CIS/RE-PAL-CS-PALM-001-26-2.pdf",
                  "categoria": "CISENG",
                  "descricao": "Documento da Qualidade - CISENG.",
                  "tipo": "PDF"
            }
      ],
      "HCI": [],
      "PALMONT": []
};

    const grid = document.getElementById('fileGrid');
    const search = document.getElementById('search');
    const category = document.getElementById('category');
    const count = document.getElementById('count');
    let clienteAberto = '';

    function normalizar(txt) {
      return String(txt || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    }

    function getIcon(tipo) {
      const t = String(tipo || '').toUpperCase();
      if (t.includes('PASTA')) return 'DIR';
      if (t.includes('PDF')) return 'PDF';
      if (t.includes('XLS') || t.includes('CSV')) return 'XLS';
      if (t.includes('DOC')) return 'DOC';
      if (t.includes('ZIP') || t.includes('RAR')) return 'ZIP';
      if (t.includes('DWG') || t.includes('DXF')) return 'CAD';
      if (t.includes('PPT')) return 'PPT';
      return 'ARQ';
    }

    function montarCategorias() {
      category.innerHTML = '<option value="">Todos os clientes</option>';
      clientes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.categoria;
        opt.textContent = c.categoria;
        category.appendChild(opt);
      });
    }

    function abrirCliente(nome) {
      clienteAberto = nome;
      category.value = nome;
      search.value = '';
      render();
    }

    function voltarClientes() {
      clienteAberto = '';
      category.value = '';
      search.value = '';
      render();
    }

    function renderClientes() {
      const termo = normalizar(search.value.trim());
      const cat = category.value;
      const filtrados = clientes.filter(c => {
        const texto = normalizar(`${c.nome} ${c.descricao} ${c.categoria}`);
        return (!termo || texto.includes(termo)) && (!cat || c.categoria === cat);
      });
      count.textContent = `${filtrados.length} ${filtrados.length === 1 ? 'cliente' : 'clientes'}`;
      grid.innerHTML = '';
      if (!filtrados.length) {
        grid.innerHTML = '<div class="empty">Nenhum cliente encontrado com os filtros atuais.</div>';
        return;
      }
      filtrados.forEach(c => {
        const qtd = (documentos[c.categoria] || []).length;
        const card = document.createElement('article');
        card.className = 'card';
        const zipBtn = c.zip
          ? `<a class="btn btn-primary" href="${c.zip}" download>Baixar ZIP</a>`
          : `<span class="btn btn-primary" style="opacity:.45;cursor:not-allowed">Sem arquivos</span>`;
        card.innerHTML = `
          <div class="file-top">
            <div class="file-icon">DIR</div>
            <div>
              <h2 class="file-title">${c.nome}</h2>
              <p class="file-meta">${qtd} ${qtd === 1 ? 'arquivo' : 'arquivos'}</p>
            </div>
          </div>
          <span class="tag">${c.categoria}</span>
          <div class="description">${c.descricao}</div>
          <div class="actions">
            <a class="btn" href="#" onclick="abrirCliente('${c.categoria}'); return false;">Abrir</a>
            ${zipBtn}
          </div>`;
        grid.appendChild(card);
      });
    }

    function renderDocumentos() {
      const lista = documentos[clienteAberto] || [];
      const termo = normalizar(search.value.trim());
      const filtrados = lista.filter(a => normalizar(`${a.nome} ${a.descricao} ${a.categoria} ${a.tipo}`).includes(termo));
      count.textContent = `${filtrados.length} ${filtrados.length === 1 ? 'arquivo' : 'arquivos'} • ${clienteAberto}`;
      grid.innerHTML = '';

      const voltar = document.createElement('div');
      voltar.style.gridColumn = '1 / -1';
      voltar.innerHTML = '<a class="btn" href="#" onclick="voltarClientes(); return false;">← Voltar para clientes</a>';
      grid.appendChild(voltar);

      if (!filtrados.length) {
        const vazio = document.createElement('div');
        vazio.className = 'empty';
        vazio.textContent = lista.length ? 'Nenhum arquivo encontrado com a busca atual.' : 'Ainda não há arquivos cadastrados para este cliente.';
        grid.appendChild(vazio);
        return;
      }

      filtrados.forEach(a => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="file-top">
            <div class="file-icon">${getIcon(a.tipo)}</div>
            <div>
              <h2 class="file-title">${a.nome}</h2>
              <p class="file-meta">${a.tipo || 'Arquivo'}</p>
            </div>
          </div>
          <span class="tag">${a.categoria}</span>
          <div class="description">${a.descricao}</div>
          <div class="actions">
            <a class="btn" href="${encodeURI(a.arquivo)}" target="_blank" rel="noopener">Abrir</a>
            <a class="btn btn-primary" href="${encodeURI(a.arquivo)}" download>Baixar</a>
          </div>`;
        grid.appendChild(card);
      });
    }

    function render() {
      if (clienteAberto) renderDocumentos();
      else renderClientes();
    }

    search.addEventListener('input', render);
    category.addEventListener('change', () => {
      clienteAberto = category.value || '';
      render();
    });

    montarCategorias();
    render();
  </script>
</body>
</html>
