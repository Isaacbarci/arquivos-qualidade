<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Arquivos | Palmont</title><style>:root{--a:#0b4fa3;--a2:#0d67c8;--bg:#f4f7fb;--bd:#dce5ef;--tx:#1d2a3a;--mu:#6a7787}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx)}header{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:26px 18px 54px}.wrap{width:min(1120px,calc(100% - 28px));margin:auto}.brand{display:flex;align-items:center;gap:14px}.brand img{width:min(330px,58vw);background:#fff;border-radius:10px;padding:8px 12px}h1{font-size:clamp(24px,4vw,34px);margin:0}.sub{opacity:.85;margin:6px 0 0}.main{margin-top:-30px;padding-bottom:45px}.toolbar{background:#fff;border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 10px 28px #1634571a}.toolbar input{width:100%;height:48px;border:1px solid var(--bd);border-radius:12px;padding:0 16px;font-size:15px}.info{margin:18px 2px 10px;color:var(--mu);font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 6px 16px #1836570f}.icon{width:46px;height:46px;border-radius:12px;background:#eaf3ff;color:var(--a);display:grid;place-items:center;font-weight:800}.top{display:flex;gap:12px;align-items:center}.card h2{font-size:17px;margin:0}.desc{color:#526071;font-size:13px;margin:16px 0}.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;border:1px solid var(--a);color:#fff;background:var(--a);cursor:pointer}.back{margin-bottom:12px;background:#fff;color:var(--a)}.list{background:#fff;border:1px solid var(--bd);border-radius:16px;overflow:hidden}.row{display:grid;grid-template-columns:1fr auto;gap:15px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--bd)}.row:last-child{border-bottom:0}.name{font-weight:650;word-break:break-word}.meta{font-size:12px;color:var(--mu);margin-top:4px}.acts{display:flex;gap:8px}.acts a:first-child{background:#fff;color:var(--a)}.empty{padding:35px;text-align:center;color:var(--mu)}footer{text-align:center;color:#7a8795;font-size:12px;padding:18px}@media(max-width:650px){.brand{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.acts{width:100%}.acts a{flex:1;text-align:center}}</style></head><body><header><div class="wrap brand"><img src="logo-palmont.png"><div><h1>Central de Arquivos Palmont</h1><p class="sub">Documentos da Qualidade</p></div></div></header><main class="wrap main"><div class="toolbar"><input id="q" placeholder="Buscar cliente ou arquivo..."></div><div class="info" id="info"></div><section id="content"></section></main><footer>Palmont Construção e Montagem Industrial • Central de Arquivos</footer><script>const DATA={"SHALOM": ["N-PAL-SH-001-26 ...pdf", "N-PAL-SH-002-26.pdf"], "CISENG": ["N-PAL-CS-PALM-003-26.pdf", "N-PAL-CS-PALM-004-26.pdf", "N-PAL-CS-PALM-005-26.pdf", "N-PAL-CS-PALM-006-26.pdf", "N-PAL-CS-PALM-007-26.pdf", "N-PAL-CS-PALM-008-26.pdf", "RE-PA-CS-PALM-002-26.pdf", "RE-PAL-CS-PALM-001-26-2.pdf"], "HCI": [], "PALMONT": []};let cliente=null;const C=document.querySelector('#content'),Q=document.querySelector('#q'),I=document.querySelector('#info');const enc=s=>encodeURIComponent(s).replace(/%2F/g,'/');function home(){cliente=null;Q.value='';render()}function openClient(c){cliente=c;Q.value='';render()}function render(){let q=Q.value.toLowerCase();if(!cliente){let cs=Object.keys(DATA).filter(x=>x.toLowerCase().includes(q));I.textContent=cs.length+' clientes';C.className='grid';C.innerHTML=cs.map(c=>`<article class="card"><div class="top"><div class="icon">📁</div><h2>${c}</h2></div><div class="desc">Documentos da Qualidade referentes ao cliente ${c}. • ${DATA[c].length} arquivo(s)</div><button class="btn" onclick="openClient('${c}')">Abrir</button></article>`).join('')}else{let fs=DATA[cliente].filter(x=>x.toLowerCase().includes(q));I.textContent=cliente+' • '+fs.length+' arquivo(s)';C.className='';C.innerHTML=`<button class="btn back" onclick="home()">← Voltar para clientes</button><div class="list">${fs.length?fs.map(f=>{let u='arquivos/'+cliente+'/'+enc(f);return `<div class="row"><div><div class="name">📄 ${f}</div><div class="meta">PDF</div></div><div class="acts"><a class="btn" target="_blank" href="${u}">Abrir</a><a class="btn" download href="${u}">Baixar</a></div></div>`}).join(''):'<div class="empty">Nenhum arquivo cadastrado para este cliente.</div>'}</div>`}}Q.addEventListener('input',render);render()</script></body></html>
