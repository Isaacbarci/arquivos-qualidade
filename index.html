<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b4fa3">
<title>Documentos da Qualidade | Palmont</title>
<style>
:root{--azul:#0b4fa3;--azul2:#0d67c8;--fundo:#f4f7fb;--texto:#1d2a3a;--muted:#6a7787;--borda:#dce5ef;--branco:#fff;}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--fundo);color:var(--texto)}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));padding:22px 18px 52px;color:#fff} .wrap{width:min(1120px,calc(100% - 28px));margin:auto}
.brand{display:flex;align-items:center;gap:16px} .logo{width:min(300px,52vw);background:#fff;border-radius:10px;padding:7px 10px} h1{font-size:clamp(22px,4vw,34px);margin:0} .sub{margin:6px 0 0;opacity:.86}
main{margin-top:-28px;padding-bottom:44px} .panel{background:#fff;border:1px solid var(--borda);border-radius:18px;padding:16px;box-shadow:0 10px 28px rgba(22,52,87,.10)}
.clients{display:grid;grid-template-columns:repeat(4,1fr);gap:10px} .client{border:1px solid var(--borda);background:#fff;border-radius:12px;padding:14px 10px;font-weight:800;color:var(--azul);cursor:pointer} .client.active{background:var(--azul);color:#fff;border-color:var(--azul)}
.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px} input{height:46px;border:1px solid var(--borda);border-radius:11px;padding:0 14px;font-size:15px} .all{height:46px;border:1px solid var(--borda);background:#fff;color:var(--azul);font-weight:700;border-radius:11px;padding:0 16px;cursor:pointer}
.info{display:flex;justify-content:space-between;margin:18px 2px 10px;color:var(--muted);font-size:13px} .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{background:#fff;border:1px solid var(--borda);border-radius:16px;padding:16px;box-shadow:0 6px 16px rgba(24,54,87,.06);display:flex;flex-direction:column;gap:12px;min-height:180px}
.top{display:flex;gap:12px;align-items:flex-start} .icon{width:48px;height:48px;border-radius:12px;background:#eaf3ff;color:var(--azul);display:grid;place-items:center;font-weight:900;flex:none} h2{font-size:15px;line-height:1.3;margin:2px 0 5px;word-break:break-word} .meta{font-size:12px;color:var(--muted)} .tag{width:max-content;padding:5px 9px;background:#eef4fb;color:#3d5873;border-radius:999px;font-size:11px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto} .btn{text-decoration:none;border:1px solid var(--borda);border-radius:10px;padding:10px;text-align:center;font-size:13px;font-weight:800;color:var(--azul)} .primary{background:var(--azul);color:#fff;border-color:var(--azul)}
.empty{grid-column:1/-1;background:#fff;border:1px dashed #b7c6d7;border-radius:16px;padding:38px 20px;text-align:center;color:var(--muted)} footer{text-align:center;color:#7a8795;font-size:12px;padding:18px}
@media(max-width:850px){.clients{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}} @media(max-width:620px){.brand{flex-direction:column;align-items:flex-start}.logo{width:min(330px,90vw)}.toolbar{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.info{flex-direction:column;gap:5px}}
</style>
</head>
<body>
<header><div class="wrap brand"><img class="logo" src="logo-palmont.png" alt="Palmont Montagem Industrial"><div><h1>Documentos da Qualidade</h1><p class="sub">Central de arquivos Palmont por cliente.</p></div></div></header>
<main class="wrap"><section class="panel"><div class="clients" id="clients"></div><div class="toolbar"><input id="search" type="search" placeholder="Buscar documento pelo nome..."><button class="all" id="showAll">Mostrar todos</button></div></section><div class="info"><span id="count"></span><span>Clique em um cliente para ver seus documentos.</span></div><section class="grid" id="grid"></section></main>
<footer>Palmont Construção e Montagem Industrial • Documentos da Qualidade</footer>
<script>
const arquivos=[{"cliente": "Shalom", "nome": "N-PAL-SH-001-26 ...pdf", "arquivo": "arquivos/CRND-001-SH/N-PAL-SH-001-26 ...pdf", "tipo": "PDF"}, {"cliente": "Shalom", "nome": "N-PAL-SH-002-26.pdf", "arquivo": "arquivos/CRND-001-SH/N-PAL-SH-002-26.pdf", "tipo": "PDF"}, {"cliente": "CISENG", "nome": "N-PAL-CS-PALM-003-26.pdf", "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-003-26.pdf", "tipo": "PDF"}, {"cliente": "CISENG", "nome": "N-PAL-CS-PALM-004-26.pdf", "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-004-26.pdf", "tipo": "PDF"}, {"cliente": "CISENG", "nome": "N-PAL-CS-PALM-005-26.pdf", "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-005-26.pdf", "tipo": "PDF"}, {"cliente": "CISENG", "nome": "N-PAL-CS-PALM-006-26.pdf", "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-006-26.pdf", "tipo": "PDF"}, {"cliente": "CISENG", "nome": "N-PAL-CS-PALM-007-26.pdf", "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-007-26.pdf", "tipo": "PDF"}, {"cliente": "CISENG", "nome": "N-PAL-CS-PALM-008-26.pdf", "arquivo": "arquivos/CRND-001-CIS/N-PAL-CS-PALM-008-26.pdf", "tipo": "PDF"}, {"cliente": "CISENG", "nome": "RE-PA-CS-PALM-002-26.pdf", "arquivo": "arquivos/CRND-001-CIS/RE-PA-CS-PALM-002-26.pdf", "tipo": "PDF"}, {"cliente": "CISENG", "nome": "RE-PAL-CS-PALM-001-26-2.pdf", "arquivo": "arquivos/CRND-001-CIS/RE-PAL-CS-PALM-001-26-2.pdf", "tipo": "PDF"}];
const clientes=['Shalom','PALMONT','HCI','CISENG'];
let clienteAtivo='Shalom';
const grid=document.getElementById('grid'), search=document.getElementById('search'), count=document.getElementById('count'), clients=document.getElementById('clients');
function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function montarClientes(){clientes.forEach(c=>{const b=document.createElement('button');b.className='client';b.textContent=c;b.dataset.client=c;b.onclick=()=>{clienteAtivo=c;atualizarBotoes();render()};clients.appendChild(b)});atualizarBotoes()}
function atualizarBotoes(){document.querySelectorAll('.client').forEach(b=>b.classList.toggle('active',b.dataset.client===clienteAtivo))}
function render(){const q=norm(search.value.trim());const arr=arquivos.filter(a=>(!clienteAtivo||a.cliente===clienteAtivo)&&(!q||norm(a.nome+' '+a.cliente).includes(q)));count.textContent=`${arr.length} ${arr.length===1?'documento':'documentos'}${clienteAtivo?' • '+clienteAtivo:''}`;grid.innerHTML='';if(!arr.length){grid.innerHTML=`<div class="empty">${clienteAtivo?`Nenhum documento cadastrado para <b>${clienteAtivo}</b>.`:'Nenhum documento encontrado.'}</div>`;return}arr.forEach(a=>{const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="top"><div class="icon">${a.tipo}</div><div><h2>${escapeHtml(a.nome)}</h2><div class="meta">Arquivo ${a.tipo}</div></div></div><span class="tag">${a.cliente}</span><div class="actions"><a class="btn" href="${encodeURI(a.arquivo)}" target="_blank" rel="noopener">Abrir</a><a class="btn primary" href="${encodeURI(a.arquivo)}" download>Baixar</a></div>`;grid.appendChild(card)})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
search.addEventListener('input',render);document.getElementById('showAll').onclick=()=>{clienteAtivo='';atualizarBotoes();render()};montarClientes();render();
</script>
</body></html>
